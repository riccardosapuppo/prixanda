# The engine's quote for a plan, with or without an offer (§4.5). The site
# never sends a price: it names the plan, the market and the offer, shows what
# comes back, and later confirms the quote by its id.
mutation SiteRequestQuote($plan: PlanCode!, $market: MarketCode!, $offerId: ID) {
  requestQuote(plan: $plan, market: $market, offerId: $offerId) {
    __typename
    ... on Quote {
      id
      plan
      market
      price
      listPrice
      monthsAtPrice
      thenPrice
      expiresAt
      offerId
    }
    ... on QuoteRefusal {
      code
      reason
    }
  }
}
