# What is for sale: the markets, a market's plans with the price a new
# subscriber pays, and the offers on sale there now (business book §2, §4, §6),
# each price with where it goes (§1.2, §5). Every figure the site shows comes
# from these answers; the site computes no price, share or date of its own.

fragment SiteBreakdown on PriceBreakdown {
  price
  vat
  net
  artists
  topUp
  paymentCosts
  companyKeeps
}

query SiteMarkets {
  markets {
    code
    name
    currency
    timeZone
    vatBasisPoints
    artistsMinimum
  }
}

query SitePlans($market: MarketCode!) {
  plans(market: $market) {
    code
    name
    paid
    listPrice
    breakdown {
      ...SiteBreakdown
    }
    entitlements {
      skipsPerHour
      audio
      offline
      seats
      needsStudentCheck
    }
  }
}

# Shown if and only if their prices are in force (§7.5): an offer is on the
# site from the moment its launch publishes it. An offer for an artist's
# listeners comes only to the listener who entered, when they are in its
# audience (§6.8), so the list changes with who entered.
query SiteOffers($market: MarketCode!) {
  offers(market: $market) {
    id
    market
    plan
    title
    text
    terms
    price
    listPrice
    monthsAtOfferPrice
    takeableUntil {
      local
      utc
    }
    audience
    needsStudentCheck
    breakdown {
      ...SiteBreakdown
    }
    listening {
      artistId
      artist
      minSeconds
      withinDays
    }
  }
}
