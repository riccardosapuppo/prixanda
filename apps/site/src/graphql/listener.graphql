# The demo listener's side (§10, §14.1, §14.5). DEMONSTRATION MODE: the
# visitor picks one of the demo's invented listeners at the entrance; the
# gateway keeps which one in an HttpOnly cookie of its own, and every call
# acts for that listener. It is not a sign-in, and nothing here moves money:
# the student verifier and the payment provider are simulated.
#
# The account also holds the price changes of the running subscription (§8),
# with every date the engine worked out, and the prepaid passes the listener
# bought (§9), each with its code: the account is the session's own, so a code
# reaches only the browser of the listener who bought it.

fragment SiteAccount on Account {
  market
  subscription {
    plan
    market
    paid
    price
    startedOn
    billingDay
    offerTitle
    offerMonths
    offerMonthsLeft
    fullPriceFrom
    fullPrice
    nextBillingOn
    nextCharge
    endsOn
    prepaidCode
    prepaidPrice
  }
  payment {
    ...SitePayment
  }
  studentVerification {
    ...SiteVerification
  }
  priceChanges {
    ...SitePriceChange
  }
  prepaidCodes {
    ...SitePrepaidCode
  }
}

fragment SitePriceChange on PriceChange {
  id
  plan
  oldPrice
  newPrice
  kind
  sentAt
  windowEnds {
    local
    utc
  }
  newSubscribersFrom {
    local
    utc
  }
  state
  newPriceFrom
  appliesFrom
  ifNoLeavesOn
  leavesOn
  ifNoAnswer
  legalBasis
}

fragment SitePrepaidCode on PrepaidCode {
  code
  passId
  title
  plan
  market
  months
  price
  boughtAt
  validUntil
  state
  payment {
    ...SitePayment
  }
  activatedOn
}

fragment SitePayment on Payment {
  state
  amount
  provider
  requestedAt
  settledAt
  receipt {
    id
    amount
    issuedAt
    provider
    providerReference
    demonstration
    note
  }
}

fragment SiteVerification on StudentVerification {
  verifiedOn
  validUntil
  provider
  valid
}

fragment SiteMe on Me {
  id
  market
  title
  csrfToken
  expiresAt
  account {
    ...SiteAccount
  }
}

query SiteDemoListeners {
  demoListeners {
    id
    market
    title
    label
    plan
    studentVerified
  }
}

query SiteMe {
  me {
    ...SiteMe
  }
}

mutation SiteSignIn($listenerId: ID!) {
  signInAsListener(listenerId: $listenerId) {
    ...SiteMe
  }
}

mutation SiteSignOut {
  signOutListener
}

mutation SiteVerifyStudent {
  verifyStudent {
    __typename
    ... on StudentVerification {
      ...SiteVerification
    }
    ... on Refusal {
      code
      reason
    }
  }
}

# A yes or a no to a price change (§8). In a consent market the two answers
# weigh the same; in a notice market the site only offers the no, which ends
# the subscription before the new price applies.
mutation SiteAnswerPriceChange($priceChangeId: ID!, $accept: Boolean!) {
  answerPriceChange(priceChangeId: $priceChangeId, accept: $accept) {
    __typename
    ... on PriceChange {
      ...SitePriceChange
    }
    ... on Refusal {
      code
      reason
    }
  }
}

mutation SiteConfirmSubscription($quoteId: ID!) {
  confirmSubscription(quoteId: $quoteId) {
    __typename
    ... on Confirmation {
      subscription {
        plan
        market
        price
        offerTitle
        offerMonths
        fullPriceFrom
        fullPrice
      }
      payment {
        ...SitePayment
      }
    }
    ... on Refusal {
      code
      reason
    }
  }
}
