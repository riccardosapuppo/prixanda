# Markets, plans and the price list, read only (business book §2, §3, §4, §5).

fragment MarketFields on Market {
  code
  name
  currency
  minorUnits
  timeZone
  vatBasisPoints
  artistsMinimum
  floor
}

query Markets {
  markets {
    ...MarketFields
  }
}

# What each market's law asks before an existing subscriber pays more, and
# what the music service chose to do: two parts, never mixed (§8.1).
query PriceChangePolicies {
  markets {
    code
    name
    priceChangePolicy {
      law {
        requirement
        basis
        sources
      }
      choice {
        windowDays
        afterWindow
        words
        alternatives
        label
      }
    }
  }
}

query Plans($market: MarketCode!) {
  plans(market: $market) {
    code
    name
    paid
    entitlements {
      skipsPerHour
      audio
      offline
      seats
      needsStudentCheck
    }
    listPrice
    breakdown {
      price
      vat
      net
      artists
      topUp
      paymentCosts
      companyKeeps
    }
  }
}

query PriceList {
  markets {
    ...MarketFields
  }
  priceList {
    id
    plan
    market
    amount
    validFrom
    validUntil
    belowFloor
    topUp
    change {
      id
      title
      currentVersion
    }
  }
}

# The catalog's artists (§14.2): found by a part of the name for a campaign
# for an album release, or named by id for the one a saved version aims at.
# Marketing, the commercial lead and finance read them.
fragment ArtistFields on Artist {
  id
  name
  label
  country
  latestRelease {
    title
    releasedOn
  }
}

query Artists($search: String, $ids: [Int!], $first: Int! = 8) {
  artists(search: $search, ids: $ids, first: $first) {
    nodes {
      ...ArtistFields
    }
    next
  }
}
