# The simulation of an offer in one market against not running it (§6.6),
# and of a price migration (§8.7), with the conditions under which finance
# must sign (§7.3).

fragment TotalsFields on Totals {
  revenue
  artists
  paymentCosts
  contribution
}

query SimulateOffer($changeId: ID!, $version: Int!, $market: MarketCode!, $overrides: [AssumptionInput!]) {
  simulateOffer(changeId: $changeId, version: $version, market: $market, overrides: $overrides) {
    __typename
    ... on Simulation {
      eligible
      takers
      stayers
      cannibalized
      withOffer {
        ...TotalsFields
      }
      withoutOffer {
        ...TotalsFields
      }
      difference {
        ...TotalsFields
      }
      discountCost
      topUpCost
      financeConditions {
        number
        rule
        met
        detail
      }
      breakEvenRetentionBasisPoints
      assumptions {
        name
        value
        source
      }
      horizonMonths
    }
    ... on Refusal {
      code
      reason
      facts {
        name
        value
      }
    }
  }
}

fragment PriceStepFields on PriceStep {
  price
  net
  artists
  paymentCosts
  contribution
}

query SimulateMigration($changeId: ID!, $version: Int, $overrides: [AssumptionInput!]) {
  simulateMigration(changeId: $changeId, version: $version, overrides: $overrides) {
    __typename
    ... on MigrationSimulation {
      before {
        ...PriceStepFields
      }
      after {
        ...PriceStepFields
      }
      newSubscribersFrom {
        market
        local
        utc
      }
      noticesFrom {
        market
        local
        utc
      }
      windowEnds {
        market
        local
        utc
      }
      existingFrom
      existing
      accepting
      notAccepting
      movingToFree
      monthlyRevenueChange
      monthlyContributionChange
      revenueAtRiskMonthly
      breakEvenAcceptanceRevenueBasisPoints
      breakEvenAcceptanceContributionBasisPoints
      prepaidPassesUntouched
      assumptions {
        name
        value
        source
      }
      financeConditions {
        number
        rule
        met
        detail
      }
    }
    ... on Refusal {
      code
      reason
      facts {
        name
        value
      }
    }
  }
}
