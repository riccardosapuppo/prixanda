# The home: what waits, what launches, what broke, who pays, what comes in
# (every number leads to an action). The revenue fields are asked for only
# in a role that reads them, and the value of prepaid
# passes not yet earned only by finance (§12.2, §9.2): the gateway answers
# FORBIDDEN on them to the others, so the console does not ask.

query Home($readsRevenue: Boolean!, $readsUnearned: Boolean!) {
  overview {
    waitingForApproval {
      ...SummaryFields
      details {
        id
        sentence
        versions {
          version
          author {
            id
          }
        }
        current {
          version
          author {
            id
          }
          content {
            __typename
            ... on OfferContent {
              plan
            }
            ... on ListPriceContent {
              plan
            }
            ... on PriceMigrationContent {
              plan
            }
            ... on PrepaidPassContent {
              plan
            }
          }
        }
        approvals {
          version
          approver {
            id
          }
        }
      }
    }
    launchesNext7Days {
      title
      state
      atRisk
      risk
      starts {
        market
        local
        utc
      }
      change {
        id
        kind
        currentVersion
      }
    }
    incidentsToday {
      title
      run
      state
      summary
      launchId
      kind
      openedAt
      closedAt
      resolution
      change {
        id
        kind
      }
    }
    payingSubscribers {
      market
      plan
      count
    }
    freeListeners {
      market
      plan
      count
    }
    monthlyRevenue @include(if: $readsRevenue) {
      market
      revenue
      revenueEur
    }
    monthlyRevenueEur @include(if: $readsRevenue)
    monthlyTopUps @include(if: $readsRevenue)
    exchangeRateNote
    prepaid @include(if: $readsUnearned) {
      market
      sold
      activated
      expired
      unearned
      unearnedEur
    }
    prepaidUnearnedEur @include(if: $readsUnearned)
  }
  markets {
    ...MarketFields
  }
}

# The week's lanes: the list prices in force and the offers that run, start
# or wait for a signature in the next seven days. The offers come a page at a
# time, newest change first, and the home reads every page up to a declared
# limit (features/home/week.tsx): an offer live for weeks can be older than
# the first fifty.
query Week($states: [ChangeState!], $after: String) {
  priceList {
    id
    plan
    market
    amount
    validFrom
    validUntil
  }
  changes(filter: { kind: OFFER, states: $states }, first: 50, after: $after) {
    nodes {
      id
      title
      state
      currentVersion
      details {
        id
        current {
          version
          content {
            __typename
            ... on OfferContent {
              plan
              periods {
                market
                startsLocal
                endsLocal
              }
            }
          }
        }
      }
    }
    next
  }
}

# The launches page: what starts in the next seven days, at risk or not.
query Launches {
  overview {
    launchesNext7Days {
      title
      state
      atRisk
      risk
      starts {
        market
        local
        utc
      }
      change {
        id
        kind
        currentVersion
      }
    }
  }
  markets {
    ...MarketFields
  }
}
