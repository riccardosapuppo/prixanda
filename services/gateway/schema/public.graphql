"""
The site's API: the public schema of the gateway (business book §2, §4, §6,
§10, §14.1, §14.5).

It shows what is for sale and where its price goes, quotes prices and, for
the demo's listeners, verifies a student and turns a quote into a
subscription. Where a price goes is public, because it is the promise of
§1.2: the VAT, the artists' share and their guaranteed minimum, what the
music service adds to reach it, what collecting the money costs and what the
service keeps. Nothing else of the economics is: no floors, thresholds or
simulations; and no changes, versions or approvals, no people of the team, no
audit. Its whole surface is listed in the gateway's contract test. The price
is always the engine's (§4.5): nothing here accepts a price, and a
subscription confirms a quote by its id.

Signing in is a DEMONSTRATION MODE, not authentication: signInAsListener
picks one of the demo's listeners, and the gateway keeps which one in a
signed, HttpOnly session cookie of the site's own, apart from the console's.
The browser never sends a listener for anything else: every call acts for the
session's listener. Nothing moves money: the payment provider and the student
verifier are simulated, and every receipt says so.

Mutations need an Idempotency-Key header, except signing in and out, and with
a session they need its CSRF token in X-CSRF-Token. Errors carry
extensions.code: UNAUTHENTICATED, FORBIDDEN, BAD_USER_INPUT, NOT_FOUND or
ENGINE_UNAVAILABLE.
"""
schema {
  query: Query
  mutation: Mutation
}

"""
An amount of money in the currency's minor unit (cents, pence), never a float.
Written as an object whose amount is a string of digits, so that no client
rounds it: {"amountMinor": "579", "currency": "EUR"}.
"""
scalar Money

"A wall-clock time in a market's time zone, ISO 8601 without an offset: 2026-10-31T23:59."
scalar LocalDateTime

"An instant, ISO 8601 in UTC: 2026-10-24T07:00:00Z."
scalar DateTime

"A day in a market's calendar, ISO 8601: 2026-10-26."
scalar Date

"A market's code, ISO 3166-1 alpha-2 in capitals: IT, FR, DE, GB."
scalar MarketCode

"A plan's code: lower-case letters, digits and dashes, starting with a letter."
scalar PlanCode

type Query {
  markets: [Market!]!
  "The plans of a market now, with the price a new subscriber pays (§4.3)."
  plans(market: MarketCode!): [Plan!]!
  "The list prices of a market, past, current and announced (§4.1)."
  prices(market: MarketCode!, plan: PlanCode): [ListPrice!]!
  "The offers on sale now in a market: shown if and only if their prices are in force (§7.5)."
  offers(market: MarketCode!): [Offer!]!
  "The demo's listeners, for the site's entrance: invented people with simulated data. Needs no session."
  demoListeners: [DemoListener!]!
  "The listener signed in on this browser, with their account; null when nobody is."
  me: Me
}

type Mutation {
  """
  A quote from the engine for a plan, with or without an offer (§4.5). The
  site shows it and confirms it later by its id; it expires. Signed in, it is
  the session's listener's quote, and the engine checks their eligibility.
  """
  requestQuote(plan: PlanCode!, market: MarketCode!, offerId: ID): QuoteResult!
  "DEMONSTRATION MODE: become one of the demo's listeners. Not authentication."
  signInAsListener(listenerId: ID!): Me!
  "Ends the site's session; false when there was none."
  signOutListener: Boolean!
  "The simulated provider verifies the session's listener as a student, for 12 months (§10)."
  verifyStudent: VerificationResult!
  """
  Subscribes the session's listener at exactly the quoted price (§4.5). The
  subscription starts at once; its first month's payment comes back PENDING
  and is settled by the payment provider shortly after: read
  me { account { payment } } again until it is not. No money moves: the
  provider is simulated, and its receipt says so.
  """
  confirmSubscription(quoteId: ID!): SubscriptionResult!
  """
  Answers a price change of the session's listener (§8): in a consent market,
  yes or no; in a notice market, no means leaving before the new price
  applies, and yes only says they read it. The same answer again comes back
  the same; another answer, or one after the window, is refused.
  """
  answerPriceChange(priceChangeId: ID!, accept: Boolean!): PriceChangeResult!
}

type Market {
  code: MarketCode!
  name: String!
  currency: String!
  timeZone: String!
  "The standard VAT rate in force, in basis points: 2200 is 22% (§3.1). Prices include it."
  vatBasisPoints: Int!
  "What every paying subscription pays into the artists' pool at least, every month, whatever the discount (§1.2, §5.3)."
  artistsMinimum: Money!
}

"Where a price goes, per subscription per month (§3.5, §5)."
type PriceBreakdown {
  price: Money!
  vat: Money!
  "The price without VAT."
  net: Money!
  "What the artists' pool receives: its share of the net amount, never less than the market's minimum (§5.3)."
  artists: Money!
  "The part of artists that the music service adds from its own margin to reach the minimum; zero when the share covers it."
  topUp: Money!
  "What collecting the money costs (§5.6)."
  paymentCosts: Money!
  "What the music service keeps; below zero when a price costs it more than it brings."
  companyKeeps: Money!
}

enum AudioQuality {
  STANDARD
  LOSSLESS
}

type Entitlements {
  "Null means unlimited."
  skipsPerHour: Int
  audio: AudioQuality!
  offline: Boolean!
  seats: Int!
  needsStudentCheck: Boolean!
}

type Plan {
  code: PlanCode!
  name: String!
  paid: Boolean!
  entitlements: Entitlements!
  "Null for the free plan. Prices include VAT (§3.2)."
  listPrice: Money
  "Where the list price goes; null for the free plan."
  breakdown: PriceBreakdown
}

type ListPrice {
  plan: PlanCode!
  market: MarketCode!
  amount: Money!
  validFrom: LocalDateTime!
  "Null: open-ended."
  validUntil: LocalDateTime
}

type MarketTime {
  local: LocalDateTime!
  utc: DateTime!
}

type Offer {
  id: ID!
  market: MarketCode!
  plan: PlanCode!
  title: String!
  text: String!
  terms: String!
  price: Money!
  "The list price in force today, struck through on the page: read from the price list, never typed in the offer (§6.2)."
  listPrice: Money!
  monthsAtOfferPrice: Int!
  "Null: no end announced."
  takeableUntil: MarketTime
  "Who may take it, in words for the page."
  audience: String!
  needsStudentCheck: Boolean!
  "Where the offer price goes in each of its months (§5); null when the engine does not give it."
  breakdown: PriceBreakdown
}

type Quote {
  id: ID!
  plan: PlanCode!
  market: MarketCode!
  price: Money!
  listPrice: Money!
  "Months at this price; 0 with the list price."
  monthsAtPrice: Int!
  "What comes after the offer: the list price in force at that time."
  thenPrice: Money!
  expiresAt: DateTime!
  "Null with the list price."
  offerId: ID
}

"One of the demo's listeners: an invented person, and what their simulated data shows."
type DemoListener {
  id: ID!
  market: MarketCode!
  "A short name for the entrance: Student in Italy, verified."
  title: String!
  "What this listener shows, in a sentence that says the data is simulated."
  label: String!
  "The plan they are on now."
  plan: PlanCode
  "A student verification valid today in their market."
  studentVerified: Boolean!
}

"The listener of this browser's session. DEMONSTRATION MODE: chosen at the entrance, not authenticated."
type Me {
  id: ID!
  market: MarketCode!
  title: String!
  "Send it back in the X-CSRF-Token header with every mutation."
  csrfToken: String!
  expiresAt: DateTime!
  account: Account!
}

type Account {
  market: MarketCode!
  "The subscription running today in the listener's market."
  subscription: Subscription!
  "The first month's payment of the running subscription; null on the free plan, and for a subscription that came with the demo's data."
  payment: Payment
  "The latest student verification; null when there has been none."
  studentVerification: StudentVerification
  "The price changes of the running subscription, the latest first (§8)."
  priceChanges: [PriceChange!]!
}

"Whether a price change asks for consent or tells in advance: the law of the listener's market (§8)."
enum PriceChangeKind {
  "Nothing changes without a yes; silence is no (§8.2)."
  CONSENT
  "The new price applies unless the listener leaves before it (§8.3 to §8.5)."
  NOTICE
}

enum PriceChangeState {
  "The window is open and no answer came; in a notice market, a yes keeps it waiting."
  WAITING
  "Said yes, in a consent market: the new price from newPriceFrom."
  ACCEPTED
  "Said no: the market's choice applies at the end of the window (consent), or the subscription ends before the new price (notice)."
  DECLINED
  "No answer by the end of a consent window, which counts as no."
  LAPSED
  "The notice ran out: the new price from newPriceFrom."
  NEW_PRICE
}

"""
A price change of the listener's subscription (§8): a request for consent,
or a notice. Its dates are the engine's, worked out for the listener's own
billing days: the site writes them as they are.
"""
type PriceChange {
  id: ID!
  plan: PlanCode!
  "What the listener pays now, and the new price."
  oldPrice: Money!
  newPrice: Money!
  kind: PriceChangeKind!
  sentAt: DateTime!
  "The end of the window: the consent deadline, or the end of the notice."
  windowEnds: MarketTime!
  "When new subscribers start paying the new price."
  newSubscribersFrom: MarketTime!
  state: PriceChangeState!
  "The first day charged at the new price, once decided."
  newPriceFrom: Date
  "While it waits: the first day charged at the new price, after a yes given today (consent) or when the notice runs out (notice)."
  appliesFrom: Date
  "While it waits: the day the paid subscription would end after a no, or without an answer (consent); null when the market's choice keeps it."
  ifNoLeavesOn: Date
  "The day the paid subscription ends because of this change, once decided."
  leavesOn: Date
  "What happens without a yes (consent), or after the notice: the market's commercial choice, in words, and that it is a choice and not law."
  ifNoAnswer: String!
  "The law of the market, in words, with its sources."
  legalBasis: String!
}

"A subscription and what it costs, month by month (§4.3, §6.1). Dates are in the market's calendar."
type Subscription {
  plan: PlanCode!
  market: MarketCode!
  paid: Boolean!
  "What each month costs now: during an offer, the quoted offer price."
  price: Money!
  startedOn: Date!
  "The day of the month it is charged on; null on the free plan."
  billingDay: Int
  "The offer it was taken with; null at the list price."
  offerTitle: String
  "Months at the offer price in all, and those still to come, the current one included."
  offerMonths: Int!
  offerMonthsLeft: Int!
  "From this billing date the list price applies (§6.1); null without an offer."
  fullPriceFrom: Date
  "That list price, as the price list stands today; null without an offer."
  fullPrice: Money
  "The next charge and its amount; null on the free plan, and when the subscription ends before it."
  nextBillingOn: Date
  nextCharge: Money
  "The day the paid subscription ends if the listener does nothing more: after a no to a price change, or without the yes it needs (§8); from then on, the free plan. Null when it does not end."
  endsOn: Date
}

"A student verification (§10.2): valid from verifiedOn, until validUntil excluded."
type StudentVerification {
  verifiedOn: Date!
  validUntil: Date!
  "simulated: no real student record was checked."
  provider: String!
  "Valid today in the listener's market."
  valid: Boolean!
}

"A receipt of the simulated payment provider. No money moved: demonstration is always true, and the note says so."
type Receipt {
  id: ID!
  amount: Money!
  issuedAt: DateTime!
  provider: String!
  providerReference: String!
  demonstration: Boolean!
  note: String!
}

"A payment's state: the provider's answer settles it, each answer counted once."
enum PaymentState {
  "Asked for and not settled yet; the subscription runs meanwhile."
  PENDING
  "Taken: the receipt is issued."
  SUCCEEDED
  "Declined: the paid subscription ends at the end of that day, and the free plan follows the day after."
  FAILED
}

"The first month's payment of a subscription confirmed from a quote (§4.5). No money moves: the provider is simulated."
type Payment {
  state: PaymentState!
  amount: Money!
  "simulated: no money moves."
  provider: String!
  requestedAt: DateTime!
  "When the provider's answer settled it; null while pending."
  settledAt: DateTime
  "Issued when the payment succeeds; null before, and when it fails."
  receipt: Receipt
}

type Confirmation {
  subscription: Subscription!
  "The first month's payment: PENDING until the provider answers, then in the account."
  payment: Payment!
}

enum RefusalCode {
  "The offer is no longer on sale."
  OFFER_ENDED
  "The quote expired, or its offer is no longer on sale: ask for a new quote."
  QUOTE_EXPIRED
  "The listener is not in the offer's audience, or the plan needs a student verification they lack."
  NOT_ELIGIBLE
  "A paid subscription of this listener is already running."
  ALREADY_SUBSCRIBED
  "The listener already took an offer that does not combine with this one (§10.3)."
  NOT_COMBINABLE
  "The offer has been taken as many times as it can be (§6.1)."
  CAP_REACHED
  "The payment provider declined a charge taken at the confirmation, so nothing was subscribed. A payment asked after the confirmation fails as a FAILED payment instead."
  PAYMENT_DECLINED
  "A price change takes no other answer: it was answered already, or its window has ended."
  ANSWER_CLOSED
  "This cannot be done here now."
  NOT_AVAILABLE
}

"The rules said no: an answer, not an error."
type Refusal {
  code: RefusalCode!
  reason: String!
}

union QuoteResult = Quote | Refusal

union VerificationResult = StudentVerification | Refusal

union SubscriptionResult = Confirmation | Refusal

union PriceChangeResult = PriceChange | Refusal
