"""
The console's API: the internal schema of the gateway (business book §6, §7,
§11, §12).

Sessions are a DEMONSTRATION MODE, not authentication: signIn picks one of the
demo's people, as the engine lists them, and the gateway keeps who they are in
a signed, HttpOnly session cookie. The browser never sends a role. Every
operation is authorized on the server from the session, following the book's
§12, and the engine checks the same identity again.

Mutations that change something in the engine need an Idempotency-Key header,
and one request carries one mutation. A business refusal (signing your own
version, saving over a newer version) is an answer, typed as a Refusal in the
mutation's result; errors carry extensions.code: UNAUTHENTICATED, FORBIDDEN,
NOT_FOUND, BAD_USER_INPUT or ENGINE_UNAVAILABLE.
"""
schema {
  query: Query
  mutation: Mutation
}

"""
An amount of money in the currency's minor unit (cents, pence), never a float
(§3.4). Written as an object whose amount is a string of digits, so that no
client rounds it: {"amountMinor": "579", "currency": "EUR"}.
"""
scalar Money

"""
A wall-clock time in a market's time zone, ISO 8601 without an offset:
2026-10-26T09:00 or 2026-10-26T09:00:00 (§3.7). Whether the market's clocks
skip or repeat that time is the engine's to say.
"""
scalar LocalDateTime

"An instant, ISO 8601 in UTC: 2026-10-24T07:00:00Z."
scalar DateTime

"A market's code, ISO 3166-1 alpha-2 in capitals: IT, FR, DE, GB."
scalar MarketCode

"A plan's code: lower-case letters, digits and dashes, starting with a letter."
scalar PlanCode

"A SHA-256 digest as 64 lower-case hexadecimal digits."
scalar Sha256

type Query {
  "The demo's people, for the sign-in screen (§12.1). Needs no session."
  people: [Person!]!
  "Who is signed in, or null. Needs no session."
  session: Session
  "The console's home: what waits, what launches, what broke, who pays, what comes in."
  overview(at: DateTime): Overview!
  markets: [Market!]!
  "The plans of a market at an instant (now when absent), with their prices and where the money goes."
  plans(market: MarketCode!, at: DateTime): [Plan!]!
  "The price list (§4); every market and plan when the filters are absent."
  priceList(market: MarketCode, plan: PlanCode): [PriceListEntry!]!
  change(id: ID!): Change
  "Changes, newest first, a page at a time (first: 1 to 100)."
  changes(filter: ChangeFilter, first: Int! = 20, after: String): ChangePage!
  "The simulation of an offer in one market against not running it (§6.6)."
  simulateOffer(changeId: ID!, version: Int!, market: MarketCode!, overrides: [AssumptionInput!]): SimulationOutcome!
  "The simulation of a price migration (§8.7); its current version when version is absent. Marketing, the commercial lead and finance."
  simulateMigration(changeId: ID!, version: Int, overrides: [AssumptionInput!]): MigrationSimulationOutcome!
  "The audit log, newest first (§11). The auditor's (§12)."
  auditEvents(filter: AuditFilter, first: Int! = 50, after: String): AuditPage!
  "Recomputes the log's chain; with an exported head, also checks that the chain still leads to it (§11.3)."
  verifyAuditChain(anchor: ChainHeadInput): ChainVerification!
  "The engine's launches, newest first, a page at a time (first: 1 to 100). Every role reads them (§12.2)."
  launches(filter: LaunchFilter, first: Int! = 20, after: String): LaunchPage!
  "One launch, step by step, with its incidents and the audit events it wrote; null when there is none."
  launch(id: ID!): LaunchRun
  """
  The catalog's artists by name, a page at a time (first: 1 to 100): a
  campaign for an album release aims at the listeners of one of them (§14.2).
  search finds a part of the name, in any case (at most 80 characters); ids
  names the artists a saved version aims at (at most 100). Marketing, the
  commercial lead and finance: whoever writes an offer and whoever signs one.
  """
  artists(search: String, ids: [Int!], first: Int! = 20, after: String): ArtistPage!
}

type Mutation {
  "DEMONSTRATION MODE: become one of the demo's people. Not authentication."
  signIn(personId: ID!): Session!
  "Ends the session; false when there was none."
  signOut: Boolean!
  createOffer(offer: OfferInput!): ChangeResult!
  createListPrice(listPrice: ListPriceInput!): ChangeResult!
  "A price migration (§8, §14.3): the commercial lead's alone (§12); finance always signs it (§7.3, conditions 1 and 5)."
  createPriceMigration(migration: PriceMigrationInput!): ChangeResult!
  "A prepaid pass (§9, §14.4): the commercial lead's alone (§12); finance signs it, as a price (§7.3, condition 1)."
  createPrepaidPass(pass: PrepaidPassInput!): ChangeResult!
  "A new version from the one the author started from; refused as STALE_VERSION when someone saved a newer one (§6.3)."
  saveOfferVersion(changeId: ID!, baseVersion: Int!, offer: OfferInput!): ChangeResult!
  saveListPriceVersion(changeId: ID!, baseVersion: Int!, listPrice: ListPriceInput!): ChangeResult!
  savePriceMigrationVersion(changeId: ID!, baseVersion: Int!, migration: PriceMigrationInput!): ChangeResult!
  savePrepaidPassVersion(changeId: ID!, baseVersion: Int!, pass: PrepaidPassInput!): ChangeResult!
  validateChange(changeId: ID!, version: Int!): ChangeResult!
  "authorReason is required when the simulated contribution is negative (§7.3, condition 4)."
  submitChange(changeId: ID!, version: Int!, authorReason: String): ChangeResult!
  "Signs the version and fingerprint the approver saw (§7.2)."
  approveChange(changeId: ID!, version: Int!, fingerprint: Sha256!): ChangeResult!
  rejectChange(changeId: ID!, version: Int!, reason: String!): ChangeResult!
  scheduleChange(changeId: ID!): ChangeResult!
  cancelChange(changeId: ID!, reason: String!): ChangeResult!
  "The on-call engineer stops an active change (§12)."
  suspendChange(changeId: ID!, reason: String!): ChangeResult!
  "The head of the log's chain, to keep outside the database (§11.3)."
  exportAuditHead: ExportHeadResult!
  """
  The on-call engineer runs a failed or refused launch again from the step
  that stopped it, or a waiting one now (§12); the reason is optional: what
  was done so that it can go through. Refused with WRONG_STATE for a launch
  that is running a step, done or cancelled.
  """
  retryLaunch(launchId: ID!, reason: String): LaunchResult!
  """
  The on-call engineer gives up a launch that has not published: its change
  is cancelled with the reason, which is required (§7.1, §12). A launch that
  has published is refused with WRONG_STATE: suspendChange takes its change
  off the site.
  """
  cancelLaunch(launchId: ID!, reason: String!): LaunchResult!
}

enum Role {
  MARKETING
  COMMERCIAL_LEAD
  FINANCE
  CATALOG_MANAGER
  ON_CALL
  AUDITOR
}

"Who wrote an audit event: a role of the book, the engine's own jobs, or a subscriber of the site (§11.1)."
enum ActorRole {
  MARKETING
  COMMERCIAL_LEAD
  FINANCE
  CATALOG_MANAGER
  ON_CALL
  AUDITOR
  SYSTEM
  SUBSCRIBER
}

"A person of the demo, named by role, never by a person's name (§12.1)."
type Person {
  id: ID!
  label: String!
  roles: [Role!]!
}

"There is no real authentication: every session is a demonstration."
enum SessionMode {
  DEMONSTRATION
}

type Session {
  mode: SessionMode!
  person: Person!
  "The roles the session acts in, as the engine lists them for the person."
  roles: [Role!]!
  "Send it back in the X-CSRF-Token header with every mutation."
  csrfToken: String!
  expiresAt: DateTime!
}

type Market {
  code: MarketCode!
  name: String!
  currency: String!
  minorUnits: Int!
  timeZone: String!
  "The standard VAT rate in force, in basis points: 2200 is 22% (§3.1)."
  vatBasisPoints: Int!
  "What every paying subscription pays into the artists' pool at least, every month (§5.3)."
  artistsMinimum: Money!
  "The lowest price whose pool covers the minimum without a top-up (§5.4)."
  floor: Money!
  "What happens before an existing subscriber pays more (§8); null when the engine gives none."
  priceChangePolicy: PriceChangePolicy
}

"""
What happens before an existing subscriber pays more (§8). Two questions,
never mixed (§8.1): what the law of the market requires, with its sources,
and what the music service chose to do, a setting of the market and never law
(§8.6).
"""
type PriceChangePolicy {
  law: PriceChangeLaw!
  choice: PriceChangeChoice!
}

"What the law of the market requires before an existing subscriber pays a higher price (§8.2 to §8.5)."
type PriceChangeLaw {
  requirement: PriceChangeRequirement!
  "The law, in words."
  basis: String!
  sources: [String!]!
}

"What the music service chose to do: a setting of the market, never law (§8.6)."
type PriceChangeChoice {
  "How long the subscriber has: to consent, or before the new price applies after the notice."
  windowDays: Int!
  "What happens at the end of the window to those who did not consent, or who did not leave."
  afterWindow: AfterWindow!
  "The same choice in words, as the subscriber reads it."
  words: String!
  "The other choices the market could make."
  alternatives: [String!]!
  "That it is a choice: Rione's choice, configurable per market. Not a legal requirement."
  label: String!
}

enum PriceChangeRequirement {
  "The subscriber must say yes, and silence is no (§8.2)."
  CONSENT
  "The subscriber is told in advance and may leave before the new price applies (§8.3 to §8.5)."
  NOTICE
}

enum AfterWindow {
  MOVE_TO_FREE
  END_AT_PERIOD_END
  KEEP_OLD_PRICE
  "In a notice market: the new price applies to those who did not leave."
  NEW_PRICE
}

enum AudioQuality {
  STANDARD
  LOSSLESS
}

type Entitlements {
  "Null means unlimited."
  skipsPerHour: Int
  audio: AudioQuality!
  offline: Boolean!
  seats: Int!
  needsStudentCheck: Boolean!
}

"Where a price goes, per subscription per month (§3.5, §5)."
type PriceBreakdown {
  price: Money!
  vat: Money!
  net: Money!
  "The pool share of the net amount, never less than the minimum."
  artists: Money!
  "The part of artists that the company adds from its margin to reach the minimum."
  topUp: Money!
  paymentCosts: Money!
  companyKeeps: Money!
}

type Plan {
  code: PlanCode!
  name: String!
  paid: Boolean!
  entitlements: Entitlements!
  "Null for the free plan."
  listPrice: Money
  breakdown: PriceBreakdown
}

type PriceListEntry {
  id: ID!
  plan: PlanCode!
  market: MarketCode!
  amount: Money!
  validFrom: LocalDateTime!
  "Null: open-ended."
  validUntil: LocalDateTime
  "The approved change that created it; null for the price list loaded at the start of the data."
  change: Change
  "Below the market's floor: a standing exception approved by finance (§5.5)."
  belowFloor: Boolean!
  "What the minimum costs the company per subscription per month at this price."
  topUp: Money!
}

enum ChangeKind {
  OFFER
  LIST_PRICE
  ENTITLEMENT
  PRICE_MIGRATION
  PREPAID
}

enum ChangeState {
  DRAFT
  VALIDATED
  IN_APPROVAL
  APPROVED
  SCHEDULED
  ACTIVE
  ENDED
  SUSPENDED
  CANCELLED
}

input ChangeFilter {
  states: [ChangeState!]
  kind: ChangeKind
  market: MarketCode
}

type ChangePage {
  nodes: [ChangeSummary!]!
  "The cursor of the next page; null on the last one."
  next: String
}

"A row of the list of changes."
type ChangeSummary {
  id: ID!
  kind: ChangeKind!
  title: String!
  state: ChangeState!
  currentVersion: Int!
  createdBy: Person!
  markets: [MarketCode!]!
  requiredSignatures: [RequiredSignature!]!
  updatedAt: DateTime!
  "The whole change, loaded in one batch with the other rows of the page."
  details: Change!
}

type Change {
  id: ID!
  kind: ChangeKind!
  title: String!
  state: ChangeState!
  "Why it was rejected, suspended or cancelled."
  stateReason: String
  currentVersion: Int!
  createdBy: Person!
  createdAt: DateTime!
  versions: [ChangeVersion!]!
  "The version that validation and approvals refer to."
  current: ChangeVersion!
  approvals: [Approval!]!
  validation: ValidationReport
  requiredSignatures: [RequiredSignature!]!
  "The difference in business words, before anyone approves (§6.5)."
  sentence: String
  "Why the campaign is worth running despite a negative contribution (§7.3, condition 4)."
  authorReason: String
  "A price migration that started: where its existing subscribers stand; null before, and for other kinds of change."
  migration: MigrationProgress
}

"How a price migration stands with the existing subscribers of its plan in its market, once it started (§8)."
type MigrationProgress {
  "What the market's law asks for."
  requirement: PriceChangeRequirement!
  "The end of the window: the consent deadline, or the end of the notice."
  windowEnds: MarketTime!
  "The subscribers asked or told, and where each stands."
  asked: Int!
  waiting: Int!
  accepted: Int!
  "Said no: in a consent market they keep their price until the window ends; in a notice market they leave before the new price applies."
  declined: Int!
  "Gave no answer in a consent market by the end of the window."
  lapsed: Int!
  "Paying the new price from their own date."
  newPrice: Int!
  "Moved to the free plan by the market's commercial choice, or ended."
  left: Int!
}

type ChangeVersion {
  version: Int!
  author: Person!
  createdAt: DateTime!
  "SHA-256 of the content as the database stored it: what an approval names (§7.2)."
  fingerprint: Sha256!
  content: ChangeContent!
}

union ChangeContent = OfferContent | ListPriceContent | PriceMigrationContent | PrepaidPassContent

enum Segment {
  "People who have never paid."
  NEVER_PAID
  "People on the free plan now."
  FREE_LISTENERS
  "Paying subscribers of currentPlan now."
  SUBSCRIBERS_OF_PLAN
  "Anyone: a gift bought for someone else."
  ANYONE
}

"Free listeners who played an artist for more than a set time lately (§14.2)."
type ListeningRule {
  artistId: Int!
  minSeconds: Int!
  withinDays: Int!
}

type Audience {
  segment: Segment!
  currentPlan: PlanCode
  needsStudentCheck: Boolean!
  listening: ListeningRule
}

"The price of an offer in one market: a fixed amount, or a percentage off the list price in force (§6.1)."
type OfferPrice {
  market: MarketCode!
  fixed: Money
  percentOffBasisPoints: Int
}

"When the offer can be taken in one market, in local time; no end: open."
type OfferPeriod {
  market: MarketCode!
  startsLocal: LocalDateTime!
  endsLocal: LocalDateTime
}

"The page of the offer in one market (§6.1)."
type OfferPage {
  market: MarketCode!
  title: String!
  text: String!
  terms: String!
  treatment: String!
}

type OfferContent {
  title: String!
  plan: PlanCode!
  audience: Audience!
  prices: [OfferPrice!]!
  monthsAtOfferPrice: Int!
  periods: [OfferPeriod!]!
  "Offers in the same group never stack (§6.1, §10.3)."
  nonCombinabilityGroup: String!
  "Null: no cap."
  redemptionCap: Int
  pages: [OfferPage!]!
}

"A new list price for one plan and market, from a local time (§4.2)."
type ListPriceContent {
  title: String!
  plan: PlanCode!
  market: MarketCode!
  amount: Money!
  startsLocal: LocalDateTime!
}

"""
A higher price for one plan in one market, for everyone (§8, §14.3): new
subscribers pay it from startsLocal; the existing subscribers of the plan in
the market are asked for their consent, or told, from noticesLocal, by the
rules of their market (Market.priceChangePolicy). Finance signs it (§7.3,
conditions 1 and 5).
"""
type PriceMigrationContent {
  title: String!
  plan: PlanCode!
  market: MarketCode!
  "The new price, above the list price in force."
  amount: Money!
  "When the existing subscribers are asked or told; the change starts then."
  noticesLocal: LocalDateTime!
  "When new subscribers start paying it; not before noticesLocal."
  startsLocal: LocalDateTime!
}

"""
A prepaid pass (§9, §14.4): months of a plan paid once, in advance, sold as
a single-use code that can be given as a gift. It never renews, and price
changes made after it was sold do not touch it. It goes on sale when the
first of its periods starts, through its launch, as a list price does.
"""
type PrepaidPassContent {
  title: String!
  "The plan it gives, for its months."
  plan: PlanCode!
  months: Int!
  "Its price in each market where it is sold, VAT included."
  prices: [PrepaidPassPrice!]!
  "When it is on sale in each market; no end: open."
  periods: [OfferPeriod!]!
  "How long a code sold can be activated: months from the day it was sold."
  codeValidMonths: Int!
  pages: [OfferPage!]!
}

"A prepaid pass's price in one market: a fixed price, VAT included."
type PrepaidPassPrice {
  market: MarketCode!
  amount: Money!
}

input ListeningRuleInput {
  artistId: Int!
  minSeconds: Int!
  withinDays: Int!
}

input AudienceInput {
  segment: Segment!
  currentPlan: PlanCode
  needsStudentCheck: Boolean! = false
  listening: ListeningRuleInput
}

"Exactly one of fixed and percentOffBasisPoints."
input OfferPriceInput {
  market: MarketCode!
  fixed: Money
  percentOffBasisPoints: Int
}

input OfferPeriodInput {
  market: MarketCode!
  startsLocal: LocalDateTime!
  endsLocal: LocalDateTime
}

input OfferPageInput {
  market: MarketCode!
  title: String!
  text: String!
  terms: String!
  treatment: String! = "standard"
}

input OfferInput {
  title: String!
  plan: PlanCode!
  audience: AudienceInput!
  prices: [OfferPriceInput!]!
  monthsAtOfferPrice: Int!
  periods: [OfferPeriodInput!]!
  nonCombinabilityGroup: String!
  "Null: no cap."
  redemptionCap: Int
  pages: [OfferPageInput!]!
}

input ListPriceInput {
  title: String!
  plan: PlanCode!
  market: MarketCode!
  amount: Money!
  startsLocal: LocalDateTime!
}

input PriceMigrationInput {
  title: String!
  plan: PlanCode!
  market: MarketCode!
  "The new price, above the list price in force."
  amount: Money!
  "When the existing subscribers are asked or told: in the future."
  noticesLocal: LocalDateTime!
  "When new subscribers start paying it: not before noticesLocal."
  startsLocal: LocalDateTime!
}

input PrepaidPassInput {
  title: String!
  plan: PlanCode!
  months: Int!
  "A fixed price, VAT included, in each market where it is sold."
  prices: [PrepaidPassPriceInput!]!
  periods: [OfferPeriodInput!]!
  "How long a code sold can be activated, in months from the day it was sold."
  codeValidMonths: Int!
  pages: [OfferPageInput!]!
}

input PrepaidPassPriceInput {
  market: MarketCode!
  amount: Money!
}

type Approval {
  version: Int!
  approver: Person!
  role: Role!
  decidedAt: DateTime!
  fingerprint: Sha256!
}

"A signature the current version needs, and why (§7.3, conditions 1 to 5)."
type RequiredSignature {
  role: Role!
  conditions: [Int!]!
  why: String!
  signed: Boolean!
}

enum Severity {
  "The version cannot be submitted."
  BLOCKING
  "It can, and someone will have to sign for it."
  NEEDS_SIGNATURE
  INFO
}

"A name and a value that a sentence for people was made of."
type Fact {
  name: String!
  value: String!
}

type ValidationFinding {
  "floor, overlap, conflict, dates, time_zone, audience, page_text or signatures."
  check: String!
  severity: Severity!
  "Null when the finding is not about one market."
  market: MarketCode
  message: String!
  facts: [Fact!]!
}

type ValidationReport {
  version: Int!
  valid: Boolean!
  findings: [ValidationFinding!]!
  "How many people the audience reaches now, counted in the data, never typed (§6.5)."
  eligible: Int!
}

enum RefusalCode {
  "The author of a version cannot approve it (§7.4)."
  OWN_VERSION
  "The actor's role may not do this (§12)."
  ROLE_NOT_ALLOWED
  "Someone saved a newer version (§6.3): the refusal's change field carries it."
  STALE_VERSION
  "The change is not in a state that allows this (§7.1)."
  WRONG_STATE
  "Another price for the same plan and market covers part of the period (§4.1)."
  OVERLAP
  "Validation found a blocking problem."
  INVALID
  "This person, or this role, has already signed this version."
  ALREADY_SIGNED
  "The approval names a version or fingerprint that is not the current one (§7.2)."
  FINGERPRINT_MISMATCH
  "A reason is required and none was given."
  REASON_REQUIRED
  "A clock change skips or repeats that local time in the market."
  AMBIGUOUS_LOCAL_TIME
  "The quote expired, or names an offer that is no longer in force (§4.5)."
  QUOTE_EXPIRED
  "The person is not in the offer's audience."
  NOT_ELIGIBLE
  "A paid subscription of this listener is already running."
  ALREADY_SUBSCRIBED
  "The listener already took an offer of the same non-combinability group (§10.3)."
  NOT_COMBINABLE
  "The offer's cap on redemptions is reached (§6.1)."
  CAP_REACHED
  "The payment provider declined the charge (the simulated one never does)."
  PAYMENT_DECLINED
}

"The rules said no: an answer, not an error."
type Refusal {
  code: RefusalCode!
  "One sentence for people."
  reason: String!
  "The numbers and names the sentence is made of."
  facts: [Fact!]!
  "The change as it is now, when the refusal is about one: with STALE_VERSION, the newer version."
  change: Change
}

union ChangeResult = Change | Refusal

type Overview {
  waitingForApproval: [ChangeSummary!]!
  launchesNext7Days: [Launch!]!
  "The incidents open at this instant, and those opened or closed on its day (UTC), newest first."
  incidentsToday: [Incident!]!
  payingSubscribers: [SubscriberCount!]!
  freeListeners: [SubscriberCount!]!
  "Revenue without VAT this month, per market. Finance and the commercial lead only (§12)."
  monthlyRevenue: [MarketRevenue!]
  "The same in euros at the declared rate (§3.6). Finance and the commercial lead only."
  monthlyRevenueEur: Money
  "What the company adds this month to reach the artists' minimum (§5.5). Finance and the commercial lead only."
  monthlyTopUps: Money
  "1 EUR = 0.83728 GBP (ECB reference rate, 23 October 2026)."
  exchangeRateNote: String!
  "The prepaid passes of each market, and their value sold and not yet earned on the day (§9.2). Finance only (§12.2)."
  prepaid: [PrepaidValue!]
  "That value in all, in euros at the declared rate. Finance only."
  prepaidUnearnedEur: Money
}

"""
The prepaid passes of a market and their value not yet earned (§9.2): a
pass's net amount is earned in equal monthly parts from its activation, the
last taking the remainder; a code not activated stays unearned until it
expires.
"""
type PrepaidValue {
  market: MarketCode!
  "Codes paid for, of which activated, and expired unused."
  sold: Int!
  activated: Int!
  expired: Int!
  "Without VAT, in the market's currency."
  unearned: Money!
  "In euros at the declared rate (§3.6)."
  unearnedEur: Money!
}

type MarketTime {
  market: MarketCode!
  local: LocalDateTime!
  utc: DateTime!
}

type Launch {
  change: Change!
  title: String!
  starts: MarketTime!
  state: ChangeState!
  "Not approved yet: it will not start until the missing signatures arrive."
  atRisk: Boolean!
  risk: String
}

"How an incident of a launch stands."
enum IncidentState {
  "Its launch went through on its own, and nobody had to act."
  RECOVERED
  OPEN
  "A person retried or cancelled the launch."
  RESOLVED
}

"Why an incident opened."
enum IncidentKind {
  "A scheduled change not live 5 minutes after its start: the alarm."
  LATE
  "A step of the launch failed 5 times."
  FAILED
  "The launch's check found a clash or a later price."
  REFUSED
}

"An incident of a launch (§7.5): a launch that failed or was refused, or a scheduled change not live 5 minutes after its start."
type Incident {
  change: Change!
  title: String!
  "The launch's run identifier, as its audit events and log lines carry it: launch-12."
  run: String!
  state: IncidentState!
  summary: String!
  "The launch it is about; launch(id) reads it. Null for a late start the engine has not begun to launch."
  launchId: ID
  kind: IncidentKind!
  openedAt: DateTime!
  "Null while it is open."
  closedAt: DateTime
  "How it closed: published at ..., cancelled by on-call-1: ...; null while it is open."
  resolution: String
}

input LaunchFilter {
  state: LaunchState
  changeId: ID
}

type LaunchPage {
  nodes: [LaunchRun!]!
  "The cursor of the next page; null on the last one."
  next: String
}

"Where a launch stands."
enum LaunchState {
  "Steps remain: the engine works on them, or waits to try a failed one again."
  RUNNING
  "Published, the site told, the live catalog checked."
  DONE
  "A step failed 5 times. Nothing was published unless its publish step is done."
  FAILED
  "The check found a clash or a later price: nothing was published, and the change stays scheduled."
  REFUSED
  "Given up before it published: its change is cancelled."
  CANCELLED
}

enum LaunchStepState {
  PENDING
  "Started and not finished: running now, or stopped by a fault and to be resumed."
  RUNNING
  DONE
  "Its last attempt failed."
  FAILED
}

"""
A launch (§7.5, §14.6): the engine's job that activates a scheduled change,
step by step, each step in a transaction of its own. It begins a minute
before the change's first start; a step that fails is tried again after a
growing wait, and after 5 failures the launch fails and opens an incident.
"""
type LaunchRun {
  id: ID!
  "The identifier its audit events and log lines carry: launch-12."
  run: String!
  change: Change!
  title: String!
  kind: ChangeKind!
  "The version that was approved and scheduled."
  version: Int!
  state: LaunchState!
  "The change's first start."
  starts: MarketTime!
  "When it was due: a minute before the start."
  dueAt: DateTime!
  "When the engine began it; null before."
  startedAt: DateTime
  "When it stopped: done, failed, refused or cancelled; null while it runs."
  finishedAt: DateTime
  "The step it is on, or stopped at; null when done."
  currentStep: String
  "Attempts of all its steps together."
  attempts: Int!
  "Why it stopped, or waits: the last error, the clash; null when all went well."
  cause: String
  "When the engine tries the failed step again; null otherwise."
  retryAt: DateTime
  "The live catalog snapshot before the launch published, and after; null until known."
  snapshotBefore: ID
  snapshotAfter: ID
  "How it ended, and what people did: published at ..., retried by on-call-1 at ...; null before."
  resolution: String
  "Its steps in order: check, prepare, publish, notify, verify. Read through launch(id): empty in a page of launches."
  steps: [LaunchStep!]!
  "The sequence numbers of the audit events it wrote (§11). Read through launch(id): empty in a page of launches."
  auditEventSeqs: [ID!]!
  incidents: [LaunchIncident!]!
}

type LaunchStep {
  "check, prepare, publish, notify, verify."
  name: String!
  "What the step does, in a sentence."
  purpose: String!
  state: LaunchStepState!
  "When its last attempt started; null before the first."
  startedAt: DateTime
  "When it was done, or its last attempt failed; null while it runs."
  finishedAt: DateTime
  attempts: Int!
  "The last attempt's error; null once the step is done."
  error: String
  "What it found or did: the snapshot it wrote, the offers it published."
  facts: [Fact!]!
}

type LaunchIncident {
  id: ID!
  kind: IncidentKind!
  state: IncidentState!
  summary: String!
  openedAt: DateTime!
  closedAt: DateTime
  resolution: String
}

union LaunchResult = LaunchRun | Refusal

type SubscriberCount {
  market: MarketCode!
  plan: PlanCode!
  count: Int!
}

type MarketRevenue {
  market: MarketCode!
  "In the market's currency, without VAT."
  revenue: Money!
  "In euros at the declared rate (§3.6)."
  revenueEur: Money!
}

enum AssumptionName {
  ELIGIBLE
  TAKE_UP
  INCREMENTAL
  RETENTION
  HORIZON_MONTHS
  "A price migration's: the subscribers of the plan in the market, counted in the data or typed."
  EXISTING
  "A price migration's: the share that accepts, in basis points, declared (§8.7)."
  ACCEPTANCE
}

"Shares in basis points (1200 is 12%); counts and months as they are."
input AssumptionInput {
  name: AssumptionName!
  value: Int!
}

type Assumption {
  name: AssumptionName!
  value: Int!
  "A default of the business book, or who typed the value and when."
  source: String!
}

"Net of VAT (§5.1)."
type Totals {
  revenue: Money!
  artists: Money!
  paymentCosts: Money!
  contribution: Money!
}

"A condition under which finance must sign (§7.3), met or not, with the numbers."
type FinanceCondition {
  number: Int!
  rule: String!
  met: Boolean!
  detail: String!
}

type Simulation {
  eligible: Int!
  takers: Int!
  stayers: Int!
  cannibalized: Int!
  withOffer: Totals!
  withoutOffer: Totals!
  difference: Totals!
  "Revenue given up on people who would have paid the list price anyway."
  discountCost: Money!
  "What the artists' minimum costs the company during the offer months."
  topUpCost: Money!
  financeConditions: [FinanceCondition!]!
  "The lowest retention, in basis points, at which the contribution is not negative; null when none is."
  breakEvenRetentionBasisPoints: Int
  assumptions: [Assumption!]!
  horizonMonths: Int!
}

union SimulationOutcome = Simulation | Refusal

"Per subscription per month, at one price (§3.5, §5)."
type PriceStep {
  price: Money!
  net: Money!
  "The pool share of the net amount, never less than the minimum."
  artists: Money!
  paymentCosts: Money!
  contribution: Money!
}

"""
The simulation of a price migration (§8.7): who pays what and from when, the
revenue at risk under an acceptance rate declared as an assumption, who would
move to the Free plan, and the prepaid passes the change never touches.
"""
type MigrationSimulation {
  before: PriceStep!
  after: PriceStep!
  "New subscribers pay the new price from here."
  newSubscribersFrom: MarketTime!
  "When the existing subscribers are asked or told, and when their window ends."
  noticesFrom: MarketTime!
  windowEnds: MarketTime!
  "How existing subscribers come to pay it, in words."
  existingFrom: String!
  existing: Int!
  accepting: Int!
  notAccepting: Int!
  "Of those not accepting, how many the market's choice moves to the free plan."
  movingToFree: Int!
  "Per month, net of VAT, against not running the migration."
  monthlyRevenueChange: Money!
  monthlyContributionChange: Money!
  "What the subscribers not accepting pay today, per month, net."
  revenueAtRiskMonthly: Money!
  "The lowest acceptance, in basis points, at which revenue does not fall; null when none is."
  breakEvenAcceptanceRevenueBasisPoints: Int
  "The same for the contribution."
  breakEvenAcceptanceContributionBasisPoints: Int
  "Prepaid passes of the plan in the market: never touched (§9.1)."
  prepaidPassesUntouched: Int!
  assumptions: [Assumption!]!
  financeConditions: [FinanceCondition!]!
}

union MigrationSimulationOutcome = MigrationSimulation | Refusal

