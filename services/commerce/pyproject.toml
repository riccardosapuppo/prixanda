[project]
name = "commerce"
version = "0.1.0"
description = "The commerce engine behind Box Office: price list, offers, approvals and the audit log, kept by PostgreSQL."
requires-python = ">=3.13"
license = "MIT"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers"
