// The console's home and the people of the demo.
//
// The home shows five things, and each leads to an action: what
// waits for approval, what launches in the next seven days, today's incidents,
// paying subscribers by plan and market, and this month's revenue without VAT.
syntax = "proto3";

package commerce.v1;

import "commerce/v1/changes.proto";
import "commerce/v1/common.proto";

service OverviewService {
  rpc GetOverview(GetOverviewRequest) returns (GetOverviewResponse);
}

service PeopleService {
  // The demo's people, named by role (§12.1): the console's entry lists them.
  rpc ListPeople(ListPeopleRequest) returns (ListPeopleResponse);
}

message GetOverviewRequest {
  // An instant, ISO 8601 with Z. Empty: the engine's clock.
  string at = 1;
}

message Launch {
  int64 change_id = 1 [jstype = JS_STRING];
  string title = 2;
  LocalTime starts = 3;
  ChangeState state = 4;
  // Not approved yet: it will not start until the missing signatures arrive.
  bool at_risk = 5;
  string risk = 6;
}

// An incident of a launch (launches.proto): a launch that failed or was
// refused, or a scheduled change not live 5 minutes after its start.
message Incident {
  int64 change_id = 1 [jstype = JS_STRING];
  string title = 2;
  // The launch's run identifier, as its audit events and log lines carry it: "launch-12".
  string run = 3;
  // open; recovered: its launch went through and nobody had to act; resolved:
  // a person retried or cancelled the launch.
  string state = 4;
  string summary = 5;
  int64 launch_id = 6 [jstype = JS_STRING];
  // late, failed, refused.
  string kind = 7;
  // ISO 8601 with Z; closed_at is empty while the incident is open.
  string opened_at = 8;
  string closed_at = 9;
  // How it closed: "published at ...", "cancelled by on-call-1: ...".
  string resolution = 10;
}

message SubscriberCount {
  string market = 1;
  string plan = 2;
  int64 count = 3;
}

message MarketRevenue {
  string market = 1;
  // In the market's currency, without VAT.
  Money revenue = 2;
  // In euros at the declared rate (§3.6).
  Money revenue_eur = 3;
}

// The prepaid passes of a market, and their value sold and not yet earned on
// the day (§9.2): each pass's net amount is earned in equal monthly parts from
// its activation, the last taking the remainder; a code not activated stays
// unearned until it expires.
message PrepaidValue {
  string market = 1;
  // Codes paid for, of which activated, and expired unused.
  int64 sold = 2;
  int64 activated = 3;
  int64 expired = 4;
  // Without VAT, in the market's currency, and in euros at the declared rate.
  Money unearned = 5;
  Money unearned_eur = 6;
}

message GetOverviewResponse {
  repeated ChangeSummary waiting_for_approval = 1;
  repeated Launch launches_next_7_days = 2;
  // The incidents open at the instant, and those opened or closed on its day
  // (UTC), newest first.
  repeated Incident incidents_today = 3;
  repeated SubscriberCount paying_subscribers = 4;
  repeated SubscriberCount free_listeners = 5;
  repeated MarketRevenue monthly_revenue = 6;
  Money monthly_revenue_eur = 7;
  // "1 EUR = 0.83728 GBP (ECB reference rate, 23 October 2026)".
  string exchange_rate_note = 8;
  // What the music service adds this month to reach the artists' minimum (§5.5).
  Money monthly_top_ups = 9;
  // Finance only (§12.2): the value of prepaid passes sold and not yet earned,
  // by market and in all; empty for the other roles.
  repeated PrepaidValue prepaid = 10;
  Money prepaid_unearned_eur = 11;
}

message Person {
  string id = 1;
  string label = 2;
  repeated Role roles = 3;
}

message ListPeopleRequest {}

message ListPeopleResponse {
  repeated Person people = 1;
}
