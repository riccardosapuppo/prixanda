// The subscriber's side (business book §4.3, §4.5, §6.1, §10, §14.1, §14.5):
// the demo's listeners, a student verification by the simulated provider, a
// quote confirmed into a subscription with a simulated payment, and the
// account a listener sees.
//
// Who the subscriber is: every request names subscriber_id, which the gateway
// takes from the site's session (a demo listener chosen at the entrance) and
// never from a field the browser filled, as for GetQuoteRequest. These calls
// carry no x-actor: in the audit log their author is the subscriber, with the
// role "subscriber". VerifyStudent and ConfirmQuote change something and carry
// an idempotency-key.
//
// Nothing here moves money or checks a real student record: the payment
// provider and the student verifier are simulated stand-ins behind small
// interfaces, they say so in every answer, and a real provider would plug in
// there.
syntax = "proto3";

package commerce.v1;

import "commerce/v1/common.proto";

service SubscriberService {
  // The demo's listeners, each labelled with what it shows. Public: the site's
  // entrance lists them before anyone has chosen.
  rpc ListDemoListeners(ListDemoListenersRequest) returns (ListDemoListenersResponse);
  // The simulated provider confirms that the listener is a student; the
  // verification is valid for 12 months (§10.2). A verification still valid on
  // the day comes back as it is, and nothing is written. A listener the
  // provider finds no student record for is refused with
  // REFUSAL_CODE_NOT_ELIGIBLE.
  rpc VerifyStudent(VerifyStudentRequest) returns (VerifyStudentResponse);
  // Subscribes at exactly the quoted price (§4.5), after checking again, at
  // the moment of confirming: the quote exists and has not expired, its offer
  // is still on sale, the listener is in its audience (§6, §10), the offer's
  // cap on redemptions is not reached, the listener never took another offer
  // of the same non-combinability group (§10.3), and no paid subscription is
  // already running. The subscription starts at once and its first month's
  // payment comes back PENDING: the engine asks the simulated provider for it
  // after the confirmation commits, through the outbox, as it would ask a real
  // one. The provider's events settle the payment, and GetAccount then shows
  // it succeeded, with a receipt that says it is a demonstration.
  rpc ConfirmQuote(ConfirmQuoteRequest) returns (ConfirmQuoteResponse);
  rpc GetAccount(GetAccountRequest) returns (GetAccountResponse);
  // The listener's answer to a price change (§8): in a consent market, yes or
  // no; in a notice market, no means leaving before the new price applies, and
  // yes only says they read it. Once answered, the same answer comes back; an
  // answer after the window, or a different answer, is refused with
  // REFUSAL_CODE_WRONG_STATE.
  rpc AnswerPriceChange(AnswerPriceChangeRequest) returns (AnswerPriceChangeResponse);
}

message DemoListener {
  int64 subscriber_id = 1 [jstype = JS_STRING];
  string market = 2;
  // A short name for the entrance: "Student in Italy, verified".
  string title = 3;
  // What this listener shows, in a sentence that says the data is simulated.
  string label = 4;
  // The plan they are on now.
  string plan = 5;
  // A student verification valid on the market's day of the request.
  bool student_verified = 6;
}

message ListDemoListenersRequest {}

message ListDemoListenersResponse {
  repeated DemoListener listeners = 1;
}

message StudentVerification {
  // ISO 8601 dates in the market's calendar: valid from verified_on, until
  // valid_until excluded (§10.2).
  string verified_on = 1;
  string valid_until = 2;
  // "simulated": no real student record was checked.
  string provider = 3;
  // The provider's reference; empty for verifications loaded with the data.
  string reference = 4;
  // Valid on the market's day of the request.
  bool valid = 5;
}

message VerifyStudentRequest {
  int64 subscriber_id = 1 [jstype = JS_STRING];
}

message VerifyStudentResponse {
  oneof outcome {
    StudentVerification verification = 1;
    Refusal refusal = 2;
  }
}

// A subscription and what it costs, month by month (§4.3, §6.1). Dates are ISO
// 8601 in the market's calendar.
message Subscription {
  int64 subscription_id = 1 [jstype = JS_STRING];
  string plan = 2;
  string market = 3;
  bool paid = 4;
  // What each month costs now: during an offer, the quoted offer price.
  Money price = 5;
  string started_on = 6;
  // The day of the month it is charged on; 0 on the free plan.
  int32 billing_day = 7;
  // The offer it was taken with; 0 at the list price.
  int64 offer_id = 8 [jstype = JS_STRING];
  string offer_title = 9;
  // Months at the offer price in all, and those still to come, the current one included.
  int32 offer_months = 10;
  int32 offer_months_left = 11;
  // From this billing date the list price applies (§6.1), and what it is as the
  // price list stands today; empty without an offer.
  string full_price_from = 12;
  Money full_price = 13;
  // The next charge and its amount; empty on the free plan, and when the
  // subscription ends before it (ends_on).
  string next_billing_on = 14;
  Money next_charge = 15;
  // The day a paid subscription ends if the listener does nothing more: after
  // a no to a price change, or without the yes one needs (§8); from then the
  // listener is on the free plan. Empty when it does not end.
  string ends_on = 16;
}

// A receipt of the simulated provider. No money moved: demonstration is always
// true, and the note says so in words.
message Receipt {
  string receipt_id = 1;
  Money amount = 2;
  // ISO 8601 with Z.
  string issued_at = 3;
  string provider = 4;
  string provider_reference = 5;
  bool demonstration = 6;
  string note = 7;
}

// The first month's payment of a subscription confirmed from a quote (§4.5).
// The provider's events settle it, each counted once however often and in
// whatever order it arrives. No money moves: the provider is simulated, and
// it accepts every charge.
enum PaymentState {
  PAYMENT_STATE_UNSPECIFIED = 0;
  // Asked for and not settled yet; the subscription runs meanwhile.
  PAYMENT_STATE_PENDING = 1;
  // Taken: the receipt is issued.
  PAYMENT_STATE_SUCCEEDED = 2;
  // Declined: the paid subscription ends at the end of that day, and the
  // listener is back on the free plan the day after.
  PAYMENT_STATE_FAILED = 3;
}

message Payment {
  string payment_id = 1;
  PaymentState state = 2;
  Money amount = 3;
  // "simulated": no money moves.
  string provider = 4;
  // ISO 8601 with Z.
  string requested_at = 5;
  // When the provider's event settled it; empty while pending.
  string settled_at = 6;
  // Why the provider declined it; empty otherwise.
  string failure_reason = 7;
  // Issued when the payment succeeds; absent before.
  Receipt receipt = 8;
}

message Confirmation {
  Subscription subscription = 1;
  // Always empty: the charge happens after the confirmation, and its receipt
  // is in Account.payment once the payment succeeded.
  Receipt receipt = 2 [deprecated = true];
  // PENDING: the provider is asked after this answer.
  Payment payment = 3;
}

message ConfirmQuoteRequest {
  string quote_id = 1;
  int64 subscriber_id = 2 [jstype = JS_STRING];
}

message ConfirmQuoteResponse {
  oneof outcome {
    Confirmation confirmation = 1;
    Refusal refusal = 2;
  }
}

message Account {
  int64 subscriber_id = 1 [jstype = JS_STRING];
  string market = 2;
  // The subscription running on the market's day of the request.
  Subscription subscription = 3;
  // The latest student verification; absent when there has been none.
  StudentVerification student_verification = 4;
  // The first month's payment of the running subscription; absent on the free
  // plan and for subscriptions that came with the data.
  Payment payment = 5;
  // The price changes of the running subscription, the latest first (§8).
  repeated PriceChange price_changes = 6;
}

// A price change as the listener sees it (§8): a request for consent, or a notice.
message PriceChange {
  int64 price_change_id = 1 [jstype = JS_STRING];
  // The price migration it comes from.
  int64 change_id = 2 [jstype = JS_STRING];
  string plan = 3;
  // What the listener pays now, and the new price.
  Money old_price = 4;
  Money new_price = 5;
  // consent: nothing changes without a yes; notice: the new price applies
  // unless the listener leaves before it.
  string kind = 6;
  // ISO 8601 with Z.
  string sent_at = 7;
  // The end of the window, in the market's local time.
  LocalTime window_ends = 8;
  // waiting: the window is open and no answer came (in a notice market, a
  // yes keeps it waiting); accepted: said yes, in a consent market, and pays
  // the new price from new_price_from; declined: said no, so the market's
  // choice applies at the end of the window (consent), or the subscription
  // ends before the new price (notice); lapsed: no answer by the end of a
  // consent window, which counts as no; new_price: the notice ran out and the
  // new price applies from new_price_from.
  string state = 9;
  // The first day the new price is charged; empty while it is not decided.
  string new_price_from = 10;
  // What happens without a yes (consent), or after the notice: the market's
  // commercial choice, in words, and that it is a choice and not law.
  string if_no_answer = 11;
  // The law of the market, in words, with its sources.
  string legal_basis = 12;
  // When new subscribers start paying the new price.
  LocalTime new_subscribers_from = 13;
  // While the request waits, as of the market's day of the read: the first
  // day charged at the new price, after a yes given that day (consent) or when
  // the notice runs out (notice); and the day the paid subscription would end
  // after a no, or without an answer (consent). if_no_leaves_on is empty when
  // the market's choice keeps the subscription. Both empty once decided.
  string applies_from = 14;
  string if_no_leaves_on = 15;
  // The day the paid subscription ends because of this change, once decided;
  // empty when it does not end.
  string leaves_on = 16;
}

message AnswerPriceChangeRequest {
  int64 subscriber_id = 1 [jstype = JS_STRING];
  int64 price_change_id = 2 [jstype = JS_STRING];
  bool accept = 3;
}

message AnswerPriceChangeResponse {
  oneof outcome {
    PriceChange price_change = 1;
    Refusal refusal = 2;
  }
}

message GetAccountRequest {
  int64 subscriber_id = 1 [jstype = JS_STRING];
}

message GetAccountResponse {
  Account account = 1;
}
